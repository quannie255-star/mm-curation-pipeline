[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-curation"
version = "1.0.0"
description = "多模态数据清洗与质量评测平台：清洗管道 → 数仓分层 → 数据服务（curation-eval 协议 + 四领域增强包）"
requires-python = ">=3.10"

[project.scripts]
# `mmc` 成为真命令（S6④ / GAP_AUDIT P1-8 收尾）：pip install 后任意目录可用
# mmc run / runs / promote / serve / contracts …
mmc = "mm_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "dags"]
# 生成物排除出 lint / format。
# `dags/generated_*.py` 的**唯一**真相源是 `src/mm_curation/platform/jobs.py`：
# 它必须与 `to_airflow_source()` 的产出**逐字节一致**（单测一条、CI 一条门禁）。
# 而 `ruff format` 会按自己的规则改写缩进与折行 —— 于是"格式合规"与"逐字节一致"
# 变成两条**互相打架**的要求，永远无法同时满足。
# 判别依据：**生成物不是人写的代码，就不该受人写代码的规则约束**。
extend-exclude = ["dags/generated_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
