[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-curation"
version = "0.1.0"
description = "中文多模态图文数据清洗与向量检索管道"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
