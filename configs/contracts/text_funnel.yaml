# 数据契约：text_funnel（中文网页新闻，2066 篇）
#
# 契约不是「跑一遍看看」，而是**进 CI 的阻断件**：severity=error 的条目失败 → exit 1。
# 改 schema 必须 bump version——否则「谁在什么时候改了口径」无从追溯。

dataset: text_funnel
version: 1
owner: data-quality
table: stg_samples

fields:
  id:
    required: true
    unique: true          # 主键：去重后仍出现重复 = 去重算子没生效
  dataset:
    required: true
  modality:
    required: true
    allowed: [text_article]
  text_len:
    required: true
    # 数值列必须用 min_value 而不是 min_len：后者比的是数字位数（笔记 #79）
    min_value: 10         # 短于 10 字符的「文章」对预训练无价值
  is_kept:
    required: true
    allowed: [0, 1]

# 跨层对账：这类断言才是契约相对「字段非空校验」的增量价值
checks:
  - name: attribution_complete
    # 对外承诺「每条丢弃都能逐条归因」。这里把它变成可执行的断言：
    # 只要有一条 is_kept=0 却没有 dropped_by，那句承诺就是假的。
    sql: |
      SELECT COUNT(*) FROM stg_samples
      WHERE dataset = 'text_funnel' AND is_kept = 0
        AND (dropped_by IS NULL OR CAST(dropped_by AS VARCHAR) = '')
    expect: 0
    severity: error

  - name: no_orphan_score
    # DWD 层内部参照完整性：分数表里的 id 必须在样本表里存在
    sql: |
      SELECT COUNT(*) FROM stg_scores s
      WHERE s.dataset = 'text_funnel'
        AND NOT EXISTS (SELECT 1 FROM stg_samples t WHERE t.dataset = s.dataset AND t.id = s.id)
    expect: 0
    severity: error

  - name: profile_reconciliation
    # DWS 汇总层 vs DWD 明细层对账：汇总说有 N 条，明细就得有 N 条
    sql: |
      SELECT ABS(p.n_total - c.n_detail) FROM marts_dataset_profile p
      JOIN (SELECT dataset, COUNT(*) AS n_detail FROM stg_samples GROUP BY 1) c
        ON c.dataset = p.dataset
      WHERE p.dataset = 'text_funnel'
    expect: 0
    severity: error

  - name: score_coverage_floor
    # 打分覆盖率跌破 90% 说明有算子静默失效（只丢不打分或压根没跑）
    sql: |
      SELECT COUNT(*) FROM marts_dataset_profile
      WHERE dataset = 'text_funnel' AND score_coverage < 0.90
    expect: 0
    severity: warn
