# 平台轨观测配置（S5）
#
# 为什么新鲜度 SLO 要**按数据集**给：这三个工业数据集是**已停产的公开数据集**
# （C-MAPSS 2000 年、MetroPT-3 2020 年、SKAB 2020 年），全量重跑一次也不会有
# 新事件日——用统一的 7 天 SLO 去卡它们，得到的是 6/8 破线这种**没有信息量**的结果
# （"源停了 20 年"不是运维事件）。而 `finance_funnel` / `text_funnel` 是本机
# 现抓的语料，滞后几天才是真信号。
#
# 所以这里给两类不同的 SLO：**能更新 vs 不能更新**。
# 这不是为了把指标做好看——而是因为一个好的告警阈值必须区分
# "源停了"（历史数据集：正常）与"源停了"（活数据集：故障）。
# 把两者混在一个阈值下，等于两种情况下都报警，也就两种都忽略。

slo:
  freshness_days: 7.0       # 默认：活数据集
  volume_margin: 3.0        # 稳健限：中位数 ± 3 × 1.4826×MAD
  min_days_for_volume: 8    # 少于 8 个事件日不定限（定出来也不可信）

datasets:
  # 历史/归档数据集：事件时间不会再前进，新鲜度不适用 → 给一个很宽的限
  cmapss:
    freshness_days: 36500.0
  metropt3:
    freshness_days: 36500.0
  skab_w64:
    freshness_days: 36500.0
  # 活数据集：保持默认 7 天
  text_funnel: {}
  finance_funnel: {}
  news_corpus: {}
  finance_news: {}
