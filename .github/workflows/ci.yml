name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # CPU 版 torch（测试用 FakeEncoder，不需要 GPU；避免 CI 拉 ~2GB CUDA 轮子）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .
          pip install ruff

      - name: Ruff lint
        run: ruff check src tests scripts dags

      - name: Ruff format check
        run: ruff format --check src tests scripts dags

      - name: Run tests
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: pytest -v
