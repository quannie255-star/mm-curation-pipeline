name: Data CI

# 数据质量门禁（V2 ε）：与代码 CI 的区别——单测验证「逻辑对」，
# 本工作流验证「质量数字达标」。合成带标注语料上真跑 dedup_fast，
# 召回/误杀低于门限即红（劣化注入实测可红，见 scripts/data_ci_benchmark.py）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC 周检
  workflow_dispatch:

jobs:
  dedup-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 门禁只依赖 numpy（dedup_fast 向量化签名）+ pillow（包的协议导入）
      # + datasketch（阈值回归门 minhash_lsh），
      # 不拉 torch——数据门禁要在 1 分钟内跑完才有存在感
      - name: Install minimal deps
        run: pip install numpy pillow datasketch

      - name: Dedup quality gate (exact ≥0.99 / near ≥0.90 / false-kill ≤1%)
        run: python scripts/data_ci_benchmark.py

      # ε 补强（2026-09-03）：图像去重门禁——md5/phash 同样被锁。
      # imagehash 自带 numpy/PyWavelets 依赖，不拉 torch，约 1 分钟
      - name: Install image deps
        run: pip install imagehash

      - name: Image dedup quality gate (exact ≥0.99 / near ≥0.97 / false-kill ≤1%)
        run: python scripts/data_ci_image_benchmark.py
