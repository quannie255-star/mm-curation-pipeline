name: Data CI

# 数据质量门禁（V2 ε）：与代码 CI 的区别——单测验证「逻辑对」，
# 本工作流验证「质量数字达标」。合成带标注语料上真跑 dedup_fast，
# 召回/误杀低于门限即红（劣化注入实测可红，见 scripts/data_ci_benchmark.py）。
#
# 与 ci.yml 的分工（2026-09-27）：
# - 本工作流 = **极小依赖**的数据质量门（numpy/pillow/datasketch/pyyaml/imagehash），
#   秒级跑完，只要"质量数字"退化就红；
# - ci.yml = 全量单测（含平台轨 `tests/test_platform_*.py` 的湖仓/台账/DAG/服务/观测）
#   + ruff + Airflow 导出物同步。
# 平台轨的数据侧门禁（`mmc contracts` / `mmc obs`）**刻意不放在这里**：
# 它们需要一个已构建的湖（`data/lake/**` 是生成物、不入库），
# 干净检出里没有可校验的对象——放进来只会变成一条永远被 skip 的假门禁。
# 它们在 `docs/PLATFORM.md` 第九节有本地复现命令。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC 周检
  workflow_dispatch:

jobs:
  dedup-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 门禁只依赖 numpy（dedup_fast 向量化签名）+ pillow（包的协议导入）
      # + datasketch（阈值回归门 minhash_lsh）+ pyyaml（配置导入链），
      # 不拉 torch——数据门禁要在 1 分钟内跑完才有存在感
      - name: Install minimal deps
        run: pip install numpy pillow datasketch pyyaml

      - name: Dedup quality gate (exact ≥0.99 / near ≥0.90 / false-kill ≤1%)
        run: python scripts/data_ci_benchmark.py

      # ε 补强（2026-09-03）：图像去重门禁——md5/phash 同样被锁。
      # imagehash 自带 numpy/PyWavelets 依赖，不拉 torch，约 1 分钟
      - name: Install image deps
        run: pip install imagehash

      - name: Image dedup quality gate (exact ≥0.99 / near ≥0.97 / false-kill ≤1%)
        run: python scripts/data_ci_image_benchmark.py

      # ε2（2026-09-03）：阈值回归门——threshold_scan 敏感性曲线对冻结基线
      # configs/threshold_baseline.json 逐点比对（recall 偏移 >0.05 /
      # 误杀 >0.02 即红），防 imagehash/datasketch 换库版本静默漂移
      - name: Threshold regression gate (curve vs frozen baseline)
        run: python scripts/threshold_regression_gate.py

      # 黄金集是**入库的冻结资产**（`data/golden/golden_set.jsonl`），
      # 所以干净检出里就有。这里只做**廉价的完整性**检查：
      # 存在 + 条数像基准。它防的是「黄金集被误删/截断」这类静默失效。
      # ⚠️ 真正拿它打分的 SLO 门禁**不在 CI**（理由见文件末尾的移除说明）。
      # ⚠️ 若缺，明确报错而不是让下游 fallback 自证 ——
      #    「没有基准也能判过」正是恒真判据最常见的来源。
      - name: 冻结黄金集完整性（缺则红，不许 fallback）
        run: |
          set -euo pipefail
          if [ ! -f data/golden/golden_set.jsonl ]; then
            echo "::error::data/golden/golden_set.jsonl 不在工作区。"
            echo "::error::检测 SLO 门禁**没有基准就等于没有门禁** —— 拒绝对空跑判绿。"
            exit 1
          fi
          n=$(wc -l < data/golden/golden_set.jsonl)
          echo "黄金集 $n 条"
          if [ "$n" -lt 100 ]; then
            echo "::error::黄金集只有 $n 条，明显不是完整基准（正常数百条）"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # ❌ 已移除（2026-10-10）：本文件曾有的第 2 个 job「变异测试（质量判据还会红）」
  #
  # 它跑 `scripts/mutation_test_detection_slo.py`（7/7）与
  # `scripts/mutation_test_agent_gate.py`（6/6），**从未在 CI 上跑通过一次**。
  #
  # 根因不是「忘了装依赖」，而是**依赖假设写错了**（原注释写「不拉 torch」）：
  #   · `eval_detection_slo.py` 跑的是 `configs/pipeline.v3_full_coverage.yaml`，
  #     其中 `clip_alignment` / `semantic_dedup` 要 CLIP 权重（~600MB），
  #     `wm_nsfw_cnn` 要 `models/detector/wm_nsfw_cnn.pt`（6MB，由
  #     `scripts/train_detector.py` **训练**出来的本地产物，不在任何 HF 仓库上）；
  #   · `agent_routing_gate.py` 的贵档基线臂就是 `perplexity`，要
  #     `uer/gpt2-chinese-cluecorpussmall` 的本地权重（~400MB）。
  #   而 `models/` 整棵在 `.gitignore` 里 —— **干净检出里这些权重一个都没有**。
  #
  # 实测失效形态（CI #78）：第一件事就崩 → 基线 rc=1 但 BREACH 0 条
  #   （崩溃被当成「合法的红」蒙混过纪律检查），M1–M6 全部因为**装置坏了**
  #   而假通过，只有 M3（唯一去输出里找 NO_SLO 字样的那条）露了馅。
  #   这正是本项目最警惕的「装置故障冒充判据」——连变异测试自己也没免疫。
  #
  # 为何不「补上依赖」：三个权重里有一个**根本不可从公开源取得**（见上），
  #   要靠训练脚本现训。按本项目既有纪律（见 gate-ci.yml 的同类说明）：
  #   **依赖「干净检出拿不到的产物」的门禁不进 CI** —— 放进来只会变成
  #   真的假绿（或永远红）。它们改列为**本地门禁**，命令见 docs/RUNBOOK.md。
  #
  # ⚠️ 结论修正：ROADMAP 曾写「5 个变异测试进 CI」并标 ✅ —— 其中 2 个
  #   （上面两条）实际从未跑过。真正在 CI 跑的是 gate-ci.yml 里那 3 个
  #   （纯 stdlib、秒级）：claims_gate / ci_assertions / no_absolute_paths。
  #   已在 docs/ROADMAP.md 与 docs/RUNBOOK.md 改成事实。
  # ─────────────────────────────────────────────────────────────────
