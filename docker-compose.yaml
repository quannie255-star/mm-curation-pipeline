# Airflow 编排层（LocalExecutor，单机轻量部署）+ 应用服务容器（S6）。
# 重计算（CLIP 批量推理等）在宿主机 GPU venv 中进行，容器负责 DAG 编排与
# CPU 可承受的规则算子——算力分级是本项目的设计考量之一，见 docs/ROADMAP.md。
services:
  # -- 应用服务容器 ------------------------------------------------------------
  # 只读数据服务：读 **prod store**（`data/envs/prod/`，由 `promote` 落盘），
  # 不是 dev。晋升在宿主机做、容器只负责供数 —— 这条分工是刻意的：
  # 容器里没有 GPU、也没有源数据（`data/raw/**` 不入镜像）。
  #
  # 端口映射到 8081：Airflow webserver 已经占了 8080。
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: mm-curation-app:latest
    ports:
      - "8081:8080"
    volumes:
      # data 可写（DuckDB 以读写方式打开库文件）；configs 只读（配置是代码的一部分）
      - ./data:/app/data
      - ./configs:/app/configs:ro
    # healthcheck 继承镜像里的那条（打 /healthz），不在这里重复定义 ——
    # 两处各写一遍必然漂移，而漂移的那一份没人会发现。
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-common: &airflow-common
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: mm-curation-airflow:latest
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
      # 容器内使用 src 布局的 mm_curation 包
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
    depends_on:
      postgres:
        condition: service_healthy

  airflow-migrate:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

volumes:
  postgres-db:
